name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'  # Diario a las 6:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # para el paso «Keep alive»

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/svitrix/svitrix-firmware.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for changes
        id: check
        run: |
          CHANGES=$(git rev-list HEAD..upstream/main --count)
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT
          echo "Commits behind upstream: $CHANGES"

      - name: Merge upstream
        if: steps.check.outputs.changes != '0'
        run: |
          git merge upstream/main --no-edit || {
            echo "::error::Merge conflict detected. Manual intervention required."
            git merge --abort
            exit 1
          }

      - name: Push changes
        if: steps.check.outputs.changes != '0'
        run: git push

      # GitHub desactiva los workflows programados tras 60 días sin actividad en el repo, y este casi
      # nunca hace commits (upstream cambia poco). Reactivarlo por la API cuenta como actividad.
      - name: Keep alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable
